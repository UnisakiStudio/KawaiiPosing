name: Multilingual documentation
on:
  pull_request:
    paths: ['README*.md', 'Packages/**', 'Tools/Documentation/**', '.github/workflows/documentation.yml']
  workflow_dispatch:
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python Tools/Documentation/check_documents.py
